# Jobs mode: the lists and thresholds you are expected to tune by hand.
#
# How entries match (case-insensitive, at word start):
#   [filter] lists are stems, as in tg_lead_radar/filters.py, and here EVERY
#   word of a phrase is a stem: "автоматизац тестир" catches "автоматизация
#   тестирования". Hashtags work too: "#резюме".
#   Dictionaries everywhere else match whole words; a trailing "*" makes a
#   word a stem: "сеньор*" catches "сеньора", while "lead" skips "leading".

[filter]
# A post is a QA vacancy candidate when any of these stems is found. Links and
# @mentions are cut out first, so a footer like "@qa_jobs" under every post of
# a general IT channel does not count.
stems = [
    "qa", "aqa", "sdet", "тестировщ", "автотест", "автоматизац тестир",
    "quality assurance", "test automation", "playwright", "pytest", "selenium",
    # added after a recon of real channels: titles these stems missed
    "автоматизированн тестир", "инженер по тестировани", "специалист по тестировани",
    "функциональн тестировани", "регрессионн тестировани", "нагрузочн тестировани",
    "test engineer", "engineer in test", "test infrastructure", "tester", "тестер",
    "qc", "quality control",
]
# A stem in the title area (first lines and hashtags) is enough. Otherwise the
# body needs this many different stems: one "взаимодействовать с тестировщиками"
# in an analyst vacancy, or "Дана, QA-инженер" in an ad, is not a QA vacancy.
body_min_stems = 2

# Rejected wherever these appear. No bare "резюме", "обучение" or
# "менторство" here: "присылайте резюме" and "обучение за счёт компании" are
# in almost every real vacancy — those words only count in the title (below).
anti = [
    # ads
    "erid", "#реклама", "на правах рекламы", "промокод", "розыгрыш",
    # candidates looking for a job
    "#резюме", "#ищуработу", "#ищу_работу", "#cv", "#resume", "#whois",
    "#opentowork", "ищу работу", "ищу позици", "ищу вакансию", "в поиске работы",
    "рассмотрю предложени", "открыт к предложени", "открыта к предложени",
    # courses and paid mentoring
    "набор на курс", "запишись на курс", "записаться на курс", "купить курс",
    "старт курса", "старт потока", "стоимость обучения", "рассрочк",
    "бесплатный урок", "бесплатный вебинар", "бесплатный курс",
    "освоить профессию", "освой профессию", "войти в it", "войти в айти",
    "стань тестировщик", "станьте тестировщик", "трудоустройство после курс",
    "гарантией трудоустройств", "ищу ментора", "ищу менти", "менторская программ",
    "записаться на менторств",
    # one-off freelance orders
    "#заказ", "#фриланс", "#freelance", "разовый заказ", "разовая задач",
    "разовая работ", "разовый проект", "оплата за проект", "бюджет проекта",
    "бюджет:",
]

# Rejected only in the title zone (first line + hashtag-only lines after it).
anti_title = [
    "курс", "обучени", "ментор", "вебинар", "интенсив", "мастер-класс",
    "марафон", "резюме", "митап", "meetup", "конференци", "подкаст",
]

[extract]
# Currency for salaries the post gives without one ("от 200к", "до 250 на
# руки") — but only when the post names no currency at all. Empty = null.
default_currency = "RUB"

# Lines with these words are salary lines; numbers elsewhere ("опыт от 3 лет")
# are ignored unless they carry a currency or "к/тыс".
salary_markers = [
    "зп", "з/п", "з.п", "зарплат*", "заработн*", "оклад*", "вилк*", "доход*",
    "оплат*", "компенсаци*", "ставк*", "на руки", "гросс", "нетто", "gross",
    "salary", "compensation", "rate", "💰", "💵", "💸", "🤑",
]
# NB: no "net" — it matches ".NET 6/8" in a stack line. "200-250k net" still
# counts: the "k" marks it as money anyway.
# Perks quote money too ("компенсация фитнеса 15 000 ₽") — never a salary.
salary_skip = [
    "фитнес*", "спорт*", "обед*", "питани*", "дмс", "страхов*", "обучени*",
    "курс*", "конференци*", "отпуск*", "реферал*", "рекомендаци*", "связ*",
    "интернет*", "оборудовани*", "техник*", "переезд*", "релокаци*", "бонус*",
    "премия за", "подписк*",
]

remote = [
    "удалён*", "удален*", "удалёнк*", "удаленк*", "remote*", "дистанц*",
    "из дома", "work from home", "wfh",
]
hybrid = ["гибрид*", "hybrid"]
office = ["офис*", "office", "on-site", "onsite", "on site", "в офисе"]

# Lines about time zones name cities without being about location:
# "с 10 до 19 по Москве", "часовой пояс: Москва".
city_skip = [
    "врем*", "часов* пояс*", "utc", "gmt", "timezone", "time zone", "по москве",
    "мск", "msk",
]

# The grade is read from the title zone, hashtags and lines that start with
# one of these words — not from the body, where "будете менторить junior'ов"
# would give a false grade.
grade_line_markers = [
    "грейд*", "уровень", "level", "позици*", "должност*", "ваканси*",
    "position", "role", "роль",
]

# Lines with these words carry the channel's own handles, not an employer's.
contact_skip = [
    "подпис*", "канал*", "наш чат", "чат:", "больше ваканси*", "реклам*",
    "разместить ваканси*", "предложить ваканси*", "размещени*", "источник*",
    "via", "админ*",
]

# A link is an apply link when its host is one of these (subdomains count;
# an entry with a path also needs that path prefix)...
apply_domains = [
    "hh.ru", "hh.kz", "hh.uz", "rabota.by", "career.habr.com", "getmatch.ru",
    "superjob.ru", "rabota.ru", "zarplata.ru", "trudvsem.ru", "geekjob.ru",
    "djinni.co", "linkedin.com/jobs", "huntflow.io", "huntflow.ru", "potok.io",
    "talantix.ru", "friend.work", "skillaz.ru", "greenhouse.io", "lever.co",
    "workable.com", "smartrecruiters.com", "ashbyhq.com", "bamboohr.com",
    "teamtailor.com", "recruitee.com", "personio.de", "wellfound.com",
    "docs.google.com/forms", "forms.gle", "forms.yandex.ru", "forms.yandex.com",
    "forms.office.com", "typeform.com", "tally.so", "airtable.com", "jotform.com",
]
# ...or a host label / path segment contains one of these.
apply_path_markers = [
    "career", "karera", "kariera", "jobs", "job", "vacanc", "vakans", "join",
    "apply", "hiring", "work-with-us",
]

