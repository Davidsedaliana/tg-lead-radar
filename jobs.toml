[dedup]
# Fuzzy matching only looks this far back (by publication date).
window_days = 30
# Jaccard similarity of 3-word shingles above which two posts are the same
# vacancy; a lower bar applies when the titles match.
similarity = 0.8
title_similarity = 0.5
# Lines skipped when taking the title: they say nothing about the vacancy.
generic_titles = [
    "вакансия", "новая вакансия", "горячая вакансия", "открыта вакансия",
    "ищем", "мы ищем", "hiring", "we are hiring", "job", "vacancy", "new job",
]

[collector]
# A post shorter than this that links to exactly one other post is a repost
# by link: the linked post is fetched and treated as the vacancy text.
linked_post_max_chars = 400
# Ceiling for the first-run history load per channel.
backfill_max_posts = 3000
# The folder is re-read this often, so channels added to it are picked up
# without a restart.
folder_refresh_minutes = 60

[discover]
queries = [
    "вакансии QA", "вакансии тестировщик", "QA jobs", "AQA вакансии",
    "IT вакансии удаленка", "тестировщик работа", "QA вакансии удаленно",
    "автотесты вакансии", "QA Automation jobs", "SDET jobs",
]
# Results per search query (Telegram caps it anyway).
search_limit = 20
# At most this many unknown channels are analysed per run.
max_candidates = 40
posts_per_channel = 100
# Pause between requests, seconds.
pause_seconds = 2.0
# A longer FloodWait stops the run; the report is written with what is done.
max_flood_wait = 300
# Group chats with vacancies exist too; off = channels only.
include_groups = false
ad_markers = [
    "erid", "#реклама", "#ad", "реклам*", "промокод*", "на правах рекламы",
    "партнерский пост", "партнёрский пост", "розыгрыш*", "по ссылке в шапке",
]

[discover.thresholds]
# "живой": all three hold. "мертвяк": no post for dead_min_days or longer.
# Everything in between is "сомнительный".
alive_max_days = 3
alive_min_posts_week = 3
alive_min_qa_share = 0.10
dead_min_days = 30

[discover.score]
# Weights of the 0..1 components; the score is 0..100.
freshness = 0.25
activity = 0.20
qa = 0.35
engagement = 0.20
# A component reaches 1.0 at these values.
activity_target_posts_week = 7
qa_target_share = 0.30
engagement_target = 0.10
# Score is multiplied by (1 - junk_penalty * share of ads and reposts).
junk_penalty = 0.5
